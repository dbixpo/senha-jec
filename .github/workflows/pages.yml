name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Ligar só a instalação desta Pages
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          url = (os.environ.get("SUPABASE_URL") or "").strip()
          key = (os.environ.get("SUPABASE_ANON_KEY") or "").strip()
          if not url or not key:
              raise SystemExit("Cadastre os secrets SUPABASE_URL e SUPABASE_ANON_KEY neste repositório.")
          Path("js").mkdir(exist_ok=True)
          Path("js/config.js").write_text(
              "window.FILA_CONFIG = {\n"
              f'  supabaseUrl: {url!r},\n'
              f'  supabaseAnonKey: {key!r}\n'
              "};\n",
              encoding="utf-8",
          )
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
